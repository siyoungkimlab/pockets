<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>boonza</title>
<link rel="stylesheet" href="../viewer/style.css">
<meta name="boonza-static" content="1"></head>
<body class="dark">
<div id="window">
  <header id="topbar">
    <div id="brand"><span class="mark"></span>boonza</div>
    <nav id="menus"></nav>
    <div id="actions">
      <button id="btn-reps" class="act" title="Representations: what each model shows, and how">Representations</button>
      <button id="btn-seq" class="act" title="The sequence above the view">Sequence</button>
      <button id="btn-cli" class="act" title="Command line (Space)">Command</button>
      <button id="btn-py" class="act" title="Python console (`)">Python</button>
      <button id="btn-min" class="act" title="Energy minimize the current model (Analyze | Minimize)">Minimize</button>
      <button id="btn-render" class="act render" title="Render a picture for a paper or a slide">Render</button>
      <button id="btn-cancel" class="act cancel" disabled>Cancel</button>
    </div>
  </header>

  <aside id="ldock" hidden>
    <div id="ldock-tabs">
      <button data-tab="builder" class="on">Molecule</button>
      <button data-tab="protein">Protein</button>
      <button id="ldock-close" title="close">✕</button>
    </div>
    <div id="ldock-body"></div>
  </aside>

  <div id="seqbar" hidden></div>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="rubber" hidden></div>
    <div id="message"></div>
    <div id="summary" hidden></div>
    <form id="cli" hidden>
      <span class="prompt">boonza&gt;</span>
      <input id="cli-input" spellcheck="false" autocomplete="off"
             placeholder="a selection (e.g. resname LIG or within 5 of resname LIG), or a command: help">
      <button type="button" id="cli-close" title="Esc">✕</button>
    </form>
    <div id="bubble" hidden></div>
    <div id="lig2d" hidden><div class="lig2d-title"></div><div class="lig2d-svg"></div></div>
    <div id="pyconsole" hidden>
      <pre id="py-out"></pre>
      <div class="py-in"><span class="prompt">&gt;&gt;&gt;</span>
        <textarea id="py-input" rows="1" spellcheck="false"
          placeholder="Python with boonza: model0, m (current model), sel (its selected atoms), view.select(...) · Enter runs, Shift+Enter a new line"></textarea>
      </div>
    </div>
    <div id="viewtools">
      <button id="vt-fit" title="Everything in view (W)">Fit</button>
      <button id="vt-center" title="The selected atoms in view">Center</button>
      <button id="vt-reset" title="Turn back and fit (R)">Reset</button>
      <span class="gap"></span>
      <button id="vt-2d" title="2D drawing of the ligand">2D</button>
      <button id="vt-clip" title="Clipping planes">Clip</button>
      <button id="vt-fog" title="Depth cue">Fog</button>
    </div>
    <div id="player" hidden>
      <button id="play" title="play (Space in the player)">▶</button>
      <input type="range" id="slider" min="0" value="0">
      <span id="frame-label"></span>
      <label>step <input type="number" id="stride" value="1" min="1"></label>
    </div>
  </main>

  <aside id="rdock">
    <section id="models-sec">
      <div class="sec-head">
        <span class="title">Models</span>
        <select id="rdock-sort" title="sort by"></select>
        <button id="rdock-all" title="show all">all</button>
        <button id="rdock-none" title="hide all but the current one">none</button>
      </div>
      <div id="rdock-list"></div>
    </section>
    <div id="side-split" title="drag to resize"></div>
    <section id="reps-sec">
      <div class="sec-head">
        <span class="title">Representations</span>
        <span id="reps-model"></span>
      </div>
      <div id="reps-tools">
        <button id="rep-new" title="a new representation of the selected atoms (else of everything)">+ New</button>
        <button id="rep-dup" title="a copy of this representation">Duplicate</button>
        <button id="rep-del" title="delete this representation">Delete</button>
        <button id="rep-presets" title="replace this model's representations with a preset">Presets ▾</button>
      </div>
      <div id="rep-list"></div>
      <div id="rep-edit"></div>
    </section>
  </aside>

  <footer id="footer">
    <div id="footer-edit"></div>
    <div id="footer-right">
      <button class="flat" id="f-hydrogens" title="Hydrogens shown: all, polar or none (click to change)">H: polar</button>
      <button class="flat" id="f-cell" title="The periodic box">Box</button>
    </div>
  </footer>
</div>

<div id="popup" class="menu" hidden></div>
<div id="panels"></div>
<script type="module" src="../viewer/main.js"></script>
</body>
</html>
